server:
  port: 8082

spring:
  application:
    name: storage-service
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:storagedb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
